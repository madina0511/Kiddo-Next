services:
  kiddo-next:
    container_name: kiddo-next
    restart: always
    image: node:20.20.0

    ports:
      - 4000:3000

    environment:
      - PORT=3000

    volumes:
      - ./:/usr/src/kiddo-next

    working_dir: /usr/src/kiddo-next

    command: bash -c "yarn && yarn run build && yarn run start"

    networks:
      - client-network

networks:
  client-network:
    driver: bridge
